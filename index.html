<!DOCTYPE html>

  <meta name="description" content="日札是一本安静的数字日记本，写下今天，收好每一个值得记住的瞬间。">
  <meta name="theme-color" content="#f4efe5">
  <title>日札 · 把日子写成书</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <script>
    (function () {
      try {
        var saved = JSON.parse(localStorage.getItem('rizha.diary.v1') || 'null');
        var preference = saved && saved.settings && saved.settings.theme || 'system';
        var dark = preference === 'dark' || (preference === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);

      } catch (error) {}
    })();
  </script>
  <link rel="stylesheet" href="styles.css">

  <div class="app">
    <div class="scrim" id="scrim" data-action="close-sidebar" aria-hidden="true"></div>

    <aside class="sidebar" id="sidebar" aria-label="日记本导航">
      <div class="sidebar-head">
        <a class="brand" href="#/home" aria-label="日札日记本首页">
          <span class="brand-seal" aria-hidden="true">札</span>
          <span class="brand-type">
            <strong>日札</strong>
            <small>把日子，写成书</small>
          </span>
        </a>
        <button class="icon-btn sidebar-close" type="button" data-action="close-sidebar" aria-label="关闭菜单">
          <svg class="icon"><use href="#i-close"></use></svg>
        </button>
      </div>

      <div class="today-card" aria-label="今天的日期">
        <span class="today-eyebrow">今天 · TODAY</span>
        <div class="today-main">
          <strong id="sideDay">26</strong>
          <span class="today-caption"><span id="sideMonth">十月</span><br><span id="sideWeek">星期日</span></span>
        </div>
        <span class="today-year" id="sideYear">2026</span>
        <span class="today-orbit" aria-hidden="true"></span>
      </div>

      <button class="write-btn" type="button" data-action="new-entry">
        <span class="write-btn-icon"><svg class="icon"><use href="#i-feather"></use></svg></span>
        <span>写下此刻</span>
        <kbd>N</kbd>
      </button>

      <nav class="sidebar-nav" aria-label="主要导航">
        <p class="nav-label">日记本</p>
        <a class="nav-item" href="#/home" data-nav="home">
          <svg class="icon"><use href="#i-home"></use></svg>
          <span>书桌</span>
        </a>
        <a class="nav-item" href="#/entries" data-nav="entries">
          <svg class="icon"><use href="#i-book"></use></svg>
          <span>全部日记</span>
          <span class="nav-count" id="navCount">0</span>
        </a>
        <a class="nav-item" href="#/calendar" data-nav="calendar">
          <svg class="icon"><use href="#i-calendar"></use></svg>
          <span>日历</span>
        </a>
        <a class="nav-item" href="#/insights" data-nav="insights">
          <svg class="icon"><use href="#i-chart"></use></svg>
          <span>心情手记</span>
        </a>
        <a class="nav-item" href="#/favorites" data-nav="favorites">
          <svg class="icon"><use href="#i-heart"></use></svg>
          <span>收藏</span>
        </a>
      </nav>

      <div class="sidebar-tags">
        <div class="nav-label-row">
          <p class="nav-label">标签</p>
          <span class="label-line" aria-hidden="true"></span>
        </div>
        <div class="tag-nav" id="tagNav"></div>
      </div>

      <div class="sidebar-foot">
        <div class="local-note">
          <span class="local-dot" aria-hidden="true"></span>
          <span>只保存在这台设备</span>
          <svg class="icon"><use href="#i-lock"></use></svg>
        </div>
        <button class="settings-link" type="button" data-action="open-settings">
          <span>偏好与备份</span>
          <svg class="icon"><use href="#i-settings"></use></svg>
        </button>
      </div>
    </aside>

    <div class="main">
      <header class="topbar">
        <div class="topbar-left">
          <button class="icon-btn menu-btn" type="button" data-action="open-sidebar" aria-label="打开菜单">
            <svg class="icon"><use href="#i-menu"></use></svg>
          </button>
          <div class="crumb" aria-label="当前位置">
            <span class="crumb-root">日札</span>
            <svg class="icon crumb-sep"><use href="#i-chevron-right"></use></svg>
            <span class="crumb-current" id="crumbCurrent">书桌</span>
          </div>
        </div>
        <div class="topbar-actions">
          <button class="search-trigger" type="button" data-action="open-search" aria-label="搜索日记">
            <svg class="icon"><use href="#i-search"></use></svg>
            <span>搜索日记</span>
            <kbd data-shortcut-search>Ctrl K</kbd>
          </button>
          <button class="icon-btn theme-btn" type="button" data-action="toggle-theme" aria-label="切换深浅色">
            <svg class="icon theme-icon-sun"><use href="#i-sun"></use></svg>
            <svg class="icon theme-icon-moon"><use href="#i-moon"></use></svg>
          </button>
          <button class="icon-btn" type="button" data-action="open-settings" aria-label="偏好与备份">
            <svg class="icon"><use href="#i-settings"></use></svg>
          </button>
        </div>
      </header>

      <main class="view" id="view" tabindex="-1"></main>
    </div>
  </div>

  <div id="editorRoot"></div>
  <div id="searchRoot"></div>
  <div id="settingsRoot"></div>
  <div id="confirmRoot"></div>
  <div class="toast-host" id="toastHost" aria-live="polite" aria-atomic="false"></div>
  <div class="sr-only" id="live" aria-live="polite"></div>

  <script src="app.js" defer></script>

</html>
